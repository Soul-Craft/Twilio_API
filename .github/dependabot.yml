version: 2
updates:
  # Actions are pinned to full commit SHAs (the version is the comment beside each); all bumps in one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]

  # requirements.txt (+ setup.py) at the root, and the test and docs requirements. Small bumps arrive in one pull
  # request; a major version is its own pull request. CI installs the pins, runs the tests and builds the docs.
  - package-ecosystem: pip
    directories: [/, /tests, /docs]
    schedule:
      interval: daily
    groups:
      minor-and-patch:
        update-types: [minor, patch]
